name: Deploy Backend to EC2
 
on:
  push:
    paths:
      - 'backend/**'
    branches: # 배포 기준이 되는 브랜치 
      - release 
      - feature/presignedUrl

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Build JAR
      working-directory: backend
      run: ./gradlew clean build  

    - name: Save SSH key
      run: |
        echo "${{ secrets.EC2_KEY }}" > ec2-key.pem
        chmod 600 ec2-key.pem

    - name: Upload JAR to EC2
      run: |
        scp -i ec2-key.pem -o StrictHostKeyChecking=no \
        ./backend/build/libs/*.jar \
        ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/home/${{ secrets.EC2_USER }}/app/app.jar

    - name: Run app on EC2
      run: |
        ssh -i ec2-key.pem -o StrictHostKeyChecking=no ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
          pkill -f 'java -jar' || true
          nohup java -jar /home/${{ secrets.EC2_USER }}/app/app.jar > /home/${{ secrets.EC2_USER }}/app/app.log 2>&1 &
        EOF
