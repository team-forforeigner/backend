name: Deploy Backend to EC2
on:
  push:
    branches: # 배포 기준이 되는 브랜치
      - release/7th

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Github Repository 파일 불러오기
        uses: actions/checkout@v4

      - name: JDK 17 설치
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: gradlew 실행 권한 부여
        run: chmod +x ./gradlew

      - name: Build JAR
        run: ./gradlew clean build -x test # 테스트 제외

      - name: JAR 이름 변경
        run: mv ./build/libs/*SNAPSHOT.jar ./build/libs/app.jar

      - name: SCP 파일 전송
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_KEY }}
          source: ./build/libs/app.jar
          target: /home/ec2-user/temp # 임시 폴더 (temp)

      - name: SSH로 EC2 접속 후 재시작
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_KEY }}
          script: |
            echo "⚡ 서버 재시작"

            mkdir -p /home/ec2-user/app

            # 새로운 JAR 덮어쓰기
            mv /home/ec2-user/temp/build/libs/app.jar /home/ec2-user/app/app.jar

            # .env 파일 환경 변수 확인 (systemd가 읽도록)
            ENV_FILE=/home/ec2-user/app/.env
            if [ -f "$ENV_FILE" ]; then
              echo "환경 변수 로드: $ENV_FILE"
              export $(grep -v '^#' $ENV_FILE | xargs)
            fi

            # 권한 조정 (필요하다면)
            chmod 755 /home/ec2-user/app/app.jar

            # systemd 서비스 재시작
            sudo systemctl daemon-reload
            sudo systemctl restart forforeigner.service
            sudo systemctl enable forforeigner.service

            # 상태 확인
            sudo systemctl status forforeigner.service --no-pager -l

            # 임시 폴더 삭제
            rm -rf /home/ec2-user/temp

            echo "✅ 배포 완료"
