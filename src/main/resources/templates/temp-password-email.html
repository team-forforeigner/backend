<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>임시 비밀번호 안내</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            color: #333;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 10px;
        }
        .button {
            display: inline-block;
            padding: 10px 20px;
            background-color: #007bff;
            color: #fff;
            text-decoration: none;
            border-radius: 5px;
            margin-top: 10px;
        }
        .note {
            font-size: 0.9em;
            color: #666;
            margin-top: 15px;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>임시 비밀번호 안내</h1>
    <p>${username}님, 임시 비밀번호가 발급되었습니다.</p>
    <p>임시 비밀번호: <strong>${tempPassword}</strong></p>
    <p>로그인 후 반드시 비밀번호를 변경해 주세요.</p>
    <p class="note">이 임시 비밀번호는 보안을 위해 1회용으로 사용하시기 바랍니다.</p>
</div>
</body>
</html>
