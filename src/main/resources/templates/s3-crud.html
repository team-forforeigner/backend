<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>S3 이미지 CRUD - 반응형</title>
    <style>
        body {
          font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
          margin: 0; padding: 0;
          background: #f0f2f5;
          color: #333;
        }
        h2 {
          text-align: center;
          margin: 20px 0;
        }
        #uploadForm {
          max-width: 600px;
          margin: 10px auto 30px auto;
          padding: 15px;
          background: #fff;
          border-radius: 8px;
          box-shadow: 0 1px 4px rgba(0,0,0,0.1);
          display: flex;
          gap: 10px;
          align-items: center;
        }
        #uploadForm input[type="file"] {
          flex-grow: 1;
        }
        #uploadForm button {
          background: #4caf50;
          color: white;
          border: none;
          padding: 8px 16px;
          border-radius: 5px;
          cursor: pointer;
        }
        #uploadForm button:hover {
          background: #45a049;
        }

        #imageGrid {
          max-width: 960px;
          margin: 0 auto 50px auto;
          display: grid;
          grid-template-columns: repeat(auto-fill,minmax(180px,1fr));
          gap: 20px;
        }
        .image-card {
          background: white;
          border-radius: 10px;
          box-shadow: 0 2px 8px rgb(0 0 0 / 0.1);
          padding: 15px;
          display: flex;
          flex-direction: column;
          align-items: center;
        }
        .image-card img {
          max-width: 160px;
          max-height: 160px;
          border-radius: 8px;
          margin-bottom: 10px;
          object-fit: contain;
          background: #fafafa;
          border: 1px solid #ddd;
        }
        .filename {
          font-weight: 600;
          margin-bottom: 6px;
          word-break: break-all;
          text-align: center;
        }
        .file-info {
          font-size: 12px;
          color: #666;
          margin-bottom: 10px;
          text-align: center;
        }
        .actions {
          width: 100%;
          display: flex;
          flex-direction: column;
          gap: 6px;
        }
        .actions input[type="file"] {
          width: 100%;
        }
        .actions button {
          width: 100%;
          padding: 6px;
          border: none;
          border-radius: 5px;
          cursor: pointer;
          font-weight: 600;
        }
        .actions button.update-btn {
          background: #2196f3;
          color: white;
        }
        .actions button.update-btn:hover {
          background: #1976d2;
        }
        .actions button.delete-btn {
          background: #f44336;
          color: white;
        }
        .actions button.delete-btn:hover {
          background: #c62828;
        }

        @media(max-width: 480px) {
          #uploadForm {
            flex-direction: column;
            gap: 8px;
          }
          #uploadForm button {
            width: 100%;
          }
        }
    </style>
</head>
<body>

<h2>S3 이미지 CRUD</h2>

<form id="uploadForm" enctype="multipart/form-data">
    <input type="file" name="file" required />
    <select name="category" required>
        <option value="">--서비스 선택--</option>
        <option value="community">커뮤니티</option>
        <option value="banner">배너</option>
        <option value="profile">프로필</option>
    </select>
    <button type="submit">업로드</button>
</form>

<select id="categorySelect">
    <option value="">--카테고리 선택--</option>
    <option value="community">커뮤니티</option>
    <option value="banner">배너</option>
    <option value="profile">프로필</option>
</select>
<button onclick="loadByCategory()">조회</button>

<div id="imageGrid">
    <!-- 이미지 카드가 여기 동적 생성됨 -->
</div>

<script>
    const apiBase = '/api/s3';

    const uploadForm = document.getElementById('uploadForm');
    const imageGrid = document.getElementById('imageGrid');

    // 이미지 목록 로드 및 화면에 렌더링
    async function loadImages() {
      imageGrid.innerHTML = '로딩 중...';
      try {
        const res = await fetch(apiBase);
        if (!res.ok) throw new Error('이미지 목록 불러오기 실패');
        const images = await res.json();

        if (!images.length) {
          imageGrid.innerHTML = '<p style="text-align:center; color:#777;">등록된 이미지가 없습니다.</p>';
          return;
        }

        imageGrid.innerHTML = '';

        images.forEach(image => {
          const card = document.createElement('div');
          card.className = 'image-card';

          const img = document.createElement('img');
          img.src = `${apiBase}/image?fileKey=${encodeURIComponent(image.filename)}`;
          img.alt = image.filename;

          const filename = document.createElement('div');
          filename.className = 'filename';
          filename.textContent = image.filename;

          const fileInfo = document.createElement('div');
          fileInfo.className = 'file-info';
          fileInfo.textContent = `크기: ${image.size} bytes\n수정일: ${image.lastModified}`;

          // 수정 파일 input
          const fileInput = document.createElement('input');
          fileInput.type = 'file';

          // 수정 버튼
          const updateBtn = document.createElement('button');
          updateBtn.textContent = '수정';
          updateBtn.className = 'update-btn';

          // 삭제 버튼
          const deleteBtn = document.createElement('button');
          deleteBtn.textContent = '삭제';
          deleteBtn.className = 'delete-btn';

          // 버튼 컨테이너
          const actions = document.createElement('div');
          actions.className = 'actions';
          actions.appendChild(fileInput);
          actions.appendChild(updateBtn);
          actions.appendChild(deleteBtn);

          card.appendChild(img);
          card.appendChild(filename);
          card.appendChild(fileInfo);
          card.appendChild(actions);
          imageGrid.appendChild(card);

          // 수정 이벤트
          updateBtn.onclick = async () => {
            if (!fileInput.files.length) {
              alert('교체할 이미지를 선택하세요.');
              return;
            }
            const formData = new FormData();
            formData.append('file', fileInput.files[0]);

            try {
              const res = await fetch(`${apiBase}/${encodeURIComponent(image.filename)}`, {
                method: 'PUT',
                body: formData,
              });
              if (!res.ok) throw new Error('수정 실패');
              alert('수정 성공');
              fileInput.value = '';
              await loadImages();
            } catch (err) {
              alert(err.message || '수정 실패');
            }
          };

          // 삭제 이벤트
          deleteBtn.onclick = async () => {
            if (!confirm(`정말 '${image.filename}' 를 삭제하시겠습니까?`)) return;

            try {
              const res = await fetch(`${apiBase}/${encodeURIComponent(image.filename)}`, {
                method: 'DELETE',
              });
              if (!res.ok) throw new Error('삭제 실패');
              alert('삭제 성공');
              await loadImages();
            } catch (err) {
              alert(err.message || '삭제 실패');
            }
          };
        });

      } catch (error) {
        imageGrid.innerHTML = `<p style="color:red; text-align:center;">${error.message}</p>`;
      }
    }

    // 업로드 처리
    uploadForm.onsubmit = async e => {
        e.preventDefault();

        const fileInput = uploadForm.querySelector('input[type="file"]');
        const categorySelect = uploadForm.querySelector('select[name="category"]');
        const file = fileInput.files[0];
        const category = categorySelect.value;

        if (!file || !category) {
            alert("파일과 카테고리를 선택하세요.");
            return;
        }

        const formData = new FormData();
        formData.append('file', file);
        formData.append('category', category);

        try {
            const res = await fetch('/api/s3/upload', {
                method: 'POST',
                body: formData
            });
            if (!res.ok) throw new Error('업로드 실패');

            alert('업로드 성공');
            uploadForm.reset();
            // 기존 loadImages() 호출 가능
            await loadImages();
        } catch (err) {
            alert(err.message || '업로드 실패');
        }
    };

    // 초기 로드
    window.onload = loadImages;

    async function loadByCategory() {
    const category = document.getElementById('categorySelect').value;
    if (!category) return alert("카테고리를 선택하세요.");

    const res = await fetch(`/api/s3/list?category=${category}`);
    if (!res.ok) return alert("조회 실패");

    const images = await res.json();
    const grid = document.getElementById('imageGrid');
    grid.innerHTML = '';

    images.forEach(img => {
        const card = document.createElement('div');
        const image = document.createElement('img');
        image.src = img.url + '&disposition=inline';
        const dlBtn = document.createElement('button');
        dlBtn.textContent = '다운로드';
        dlBtn.onclick = () => window.open(img.url + '&disposition=attachment', '_blank');

        card.appendChild(image);
        card.appendChild(dlBtn);
        grid.appendChild(card);
    });
}

</script>

</body>
</html>
