<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>새 글 작성</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        /* 추가적인 디자인 커스텀 */
        body {
            background-color: #f8f9fa; /* 전체 페이지 배경색 */
        }
        .container {
            max-width: 800px; /* 최대 너비 지정 */
            margin-top: 50px;
            background-color: #ffffff; /* 폼 배경색 */
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.05);
        }
        .btn-custom-cancel {
            background-color: #6c757d;
            border-color: #6c757d;
            color: white;
        }
        .btn-custom-cancel:hover {
            background-color: #5a6270;
            border-color: #545b62;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="text-center mb-4">
        <h2>새 글 작성</h2>
    </div>

    <form action="/board/save" method="post" enctype="multipart/form-data">

        <div class="mb-3">
            <label for="boardWriter" class="form-label">작성자</label>
            <input type="text" class="form-control" name="boardWriter" id="boardWriter" placeholder="이름을 입력하세요" required>
        </div>

        <div class="mb-3">
            <label for="boardTitle" class="form-label">제목</label>
            <input type="text" class="form-control" name="boardTitle" id="boardTitle" placeholder="제목을 입력하세요" required>
        </div>

        <div class="mb-3">
            <label for="boardContents" class="form-label">내용</label>
            <textarea class="form-control" name="boardContents" id="boardContents" rows="10" placeholder="내용을 입력하세요" required></textarea>
        </div>

        <div class="mb-3">
            <label for="boardFile" class="form-label">파일 첨부</label>
            <input class="form-control" type="file" name="boardFile" id="boardFile" accept="image/*">
        </div>

        <div class="d-flex justify-content-end mt-4">
            <button type="button" class="btn btn-custom-cancel me-2" onclick="history.back()">취소</button>
            <button type="submit" class="btn btn-primary">글 작성</button>
        </div>
    </form>
</div>

</body>
</html>
