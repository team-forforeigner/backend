<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>글 수정</title>
  <style>
    body { font-family: '맑은 고딕', Arial, sans-serif; background: #fff; margin: 0; padding: 30px 0; }
    .container { max-width: 440px; margin: 0 auto; background: #fafbfc; border-radius: 10px; box-shadow: 0 2px 7px rgba(70,110,180,0.06); padding: 38px 30px 30px 30px; }
    h2 { margin-top: 0; margin-bottom: 24px; font-size: 1.7rem; text-align: center; font-weight: 700; letter-spacing: -1px; }
    label { display: block; margin-bottom: 6px; font-weight: 500; font-size: 15px; }
    input[type="text"], textarea { width: 100%; padding: 8px 9px; margin-bottom: 19px; border: 1px solid #d6dbe2; border-radius: 4px; font-size: 15px; box-sizing: border-box; }
    textarea { min-height: 90px; resize: vertical; }
    .btn-box { text-align: center; }
    input[type="submit"], .btn-box button { background: #3e7fff; color: #fff; border: none; border-radius: 3px; font-size: 16px; padding: 8px 32px; cursor: pointer; transition: background 0.2s; }
    input[type="submit"]:hover, .btn-box button:hover { background: #265ed7; }
  </style>
</head>
<body>
<div class="container">
  <h2>글 수정</h2>
  <form action="/board/update" method="post">
    <input type="hidden" name="id" th:value="${boardUpdate.id}">

    <label>작성자</label>
    <input type="text" name="boardWriter" th:value="${boardUpdate.boardWriter}" readonly>

    <label for="boardTitle">제목</label>
    <input type="text" name="boardTitle" id="boardTitle" th:value="${boardUpdate.boardTitle}" required>

    <label for="boardContents">내용</label>
    <textarea name="boardContents" id="boardContents" cols="30" rows="10" th:text="${boardUpdate.boardContents}" required></textarea>

    <div class="btn-box">
      <input type="submit" value="수정 완료">
      <button type="button" th:onclick="|location.href='@{/board/{id}(id=${boardUpdate.id})}'|">취소</button>
    </div>
  </form>
</div>
</body>
</html>
