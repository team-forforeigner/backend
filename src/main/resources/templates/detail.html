<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>상세보기</title>
  <style>
    body { font-family: '맑은 고딕', Arial, sans-serif; margin: 40px; color: #333; }
    .container { max-width: 750px; margin: 0 auto; }
    .board-table { border-collapse: collapse; width: 100%; margin-bottom: 20px; border-top: 2px solid #333; }
    .board-table th, .board-table td { border-bottom: 1px solid #ddd; padding: 15px; font-size: 15px; }
    .board-table th { background: #f8f9fa; text-align: center; width: 120px; font-weight: 500; }
    .board-table td { text-align: left; }
    .board-content { min-height: 200px; padding: 20px; line-height: 1.6; }
    .board-img { max-width: 100%; height: auto; display: block; margin: 20px auto; border-radius: 6px; }
    .action-container { text-align: center; margin-bottom: 40px; }
    .like-report-container { display: flex; justify-content: center; align-items: center; gap: 15px; margin-bottom: 20px; }
    .btn, .like-btn, .report-btn { padding: 9px 22px; border: none; border-radius: 5px; font-size: 14px; cursor: pointer; transition: all 0.2s; font-weight: 500; }
    .btn { background: #6c757d; color: #fff; }
    .btn:hover { background: #5a6270; }
    .like-btn { display: inline-flex; align-items: center; gap: 6px; background: #e74c3c; color: #fff; }
    .like-btn:hover { background: #c0392b; }
    .report-btn { background: #f1c40f; color: #333; }
    .report-btn:hover { background: #f39c12; }
    #comment-section { margin-top:50px; padding-top: 30px; border-top: 1px dashed #ccc; }
    #comment-section h3 { font-size: 1.3rem; margin-bottom: 15px;}
    #comment-write input[type="text"] { padding: 8px; margin-right: 6px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
    #comment-write input[placeholder="작성자"] { width: 120px; }
    #comment-write input[placeholder="내용"] { width: 400px; }
    #comment-write-btn { padding: 8px 18px; }
    #comment-list { margin-top: 20px; }
    .comment-table { width: 100%; font-size: 14px; border-collapse: collapse; }
    .comment-table th, .comment-table td { border-bottom: 1px solid #eee; padding: 9px 8px; text-align: left;}
    .comment-table th { background: #fafafa; text-align: center; font-weight: 500;}
  </style>
  <script src="https://code.jquery.com/jquery-3.6.3.min.js" crossorigin="anonymous"></script>
</head>
<body>
<div class="container">
  <table class="board-table">
    <tr>
      <th>제목</th><td th:text="${board.boardTitle}" colspan="3"></td>
    </tr>
    <tr>
      <th>작성자</th><td><span th:text="${board.boardWriter}"></span></td>
      <th>작성일</th><td><span th:text="*{#temporals.format(board.boardCreatedTime, 'yyyy-MM-dd HH:mm')}"></span></td>
    </tr>
    <tr>
      <th>조회수</th><td th:text="${board.boardHits}" colspan="3"></td>
    </tr>
    <tr th:if="${board.fileAttached == 1}">
      <td colspan="4">
        <img th:src="@{|/upload/${board.storedFileName}|}" class="board-img" alt="첨부 이미지">
      </td>
    </tr>
    <tr>
      <td colspan="4" class="board-content" th:utext="${#strings.replace(board.boardContents, '\n', '<br/>')}"></td>
    </tr>
  </table>

  <div class="like-report-container">
    <button class="like-btn" onclick="likeReq()">
      👍 좋아요 <span id="like-count" th:text="${board.boardLikes}"></span>
    </button>
    <button class="report-btn" onclick="reportReq('board', boardId)">게시글 신고</button>
  </div>

  <div class="action-container">
    <button class="btn" onclick="listReq()">목록</button>
    <button class="btn" onclick="updateReq()">수정</button>
    <button class="btn" onclick="deleteReq()">삭제</button>
  </div>

  <div id="comment-section">
    <h3>댓글</h3>
    <div id="comment-write">
      <input type="text" id="commentWriter" placeholder="작성자">
      <input type="text" id="commentContents" placeholder="내용" style="width: 50%;">
      <button id="comment-write-btn" class="btn" onclick="commentWrite()">댓글 작성</button>
    </div>

    <div id="comment-list">
      <table class="comment-table">
        <tr>
          <th style="width:15%;">작성자</th>
          <th>내용</th>
          <th style="width:20%;">작성 시간</th>
        </tr>
        <tr th:each="comment: ${commentList}">
          <td style="text-align:center;" th:text="${comment.commentWriter}"></td>
          <td th:text="${comment.commentContents}"></td>
          <td style="text-align:center;" th:text="*{#temporals.format(comment.commentCreatedTime, 'yyyy-MM-dd HH:mm')}"></td>
        </tr>
      </table>
    </div>
  </div>
</div>

<script th:inline="javascript">
  const boardId = [[${board.id}]];
  const page = [[${page}]];

  const listReq = () => location.href = "/board/?page=" + page;
  const updateReq = () => location.href = "/board/update/" + boardId;

  // [수정 완료] 삭제 기능 (POST 방식)
  const deleteReq = () => {
    if (confirm("정말로 삭제하시겠습니까?")) {
      // CSRF 토큰이 필요하다면 헤더에 추가해야 합니다 (현재는 생략)
      $.ajax({
        type: 'post',
        url: '/board/delete/' + boardId,
        success: function () {
          alert("삭제되었습니다.");
          listReq();
        },
        error: function (err) {
          console.error("삭제 실패", err);
          alert("삭제에 실패했습니다.");
        }
      });
    }
  }

  // [추가 완료] 좋아요 기능
  const likeReq = () => {
    $.ajax({
      type: 'post',
      url: '/board/' + boardId + '/like',
      success: function (newLikeCount) {
        $('#like-count').text(newLikeCount);
      },
      error: function () {
        alert("좋아요 처리에 실패했습니다.");
      }
    });
  }

  // [추가 완료] 신고 기능
  const reportReq = (type, targetId) => {
    const reason = prompt("신고 사유를 입력해주세요.");
    if (reason && reason.trim() !== "") {
      $.ajax({
        type: 'post',
        url: '/report',
        contentType: 'application/json',
        data: JSON.stringify({
          reportType: type.toUpperCase(),
          targetId: targetId,
          content: reason,
          reporter: "anonymous"
        }),
        success: function (res) {
          alert(res);
        },
        error: function () {
          alert("신고 접수에 실패했습니다.");
        }
      });
    } else if (reason !== null) {
      alert("신고 사유를 입력해주세요.");
    }
  }

  // [복구] 댓글 작성 기능
  const commentWrite = () => {
    const writer = $("#commentWriter").val();
    const contents = $("#commentContents").val();
    if (!writer || !contents) {
      alert("작성자와 내용을 모두 입력해주세요.");
      return;
    }

    $.ajax({
      type: 'post',
      url: '/comment/save',
      data: {
        commentWriter: writer,
        commentContents: contents,
        boardId: boardId
      },
      dataType: 'json',
      success: function (commentList) {
        let output = "<table class='comment-table'>";
        output += "<tr><th style='width:15%;'>작성자</th><th>내용</th><th style='width:20%;'>작성 시간</th></tr>";
        for (const comment of commentList) {
          output += `<tr>`;
          output += `<td style="text-align:center;">${comment.commentWriter}</td>`;
          output += `<td>${comment.commentContents}</td>`;
          output += `<td style="text-align:center;">${new Date(comment.commentCreatedTime).toLocaleString()}</td>`;
          output += `</tr>`;
        }
        output += "</table>";
        $('#comment-list').html(output);
        $("#commentWriter").val('');
        $("#commentContents").val('');
      },
      error: function (err) {
        console.error("댓글 작성 실패", err);
        alert("댓글 작성에 실패했습니다.");
      }
    });
  }
</script>
</body>
</html>
