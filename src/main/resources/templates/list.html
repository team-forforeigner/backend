<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>게시판</title>
  <style>
    body { font-family: '맑은 고딕', Arial, sans-serif; background: #f4f6f9; margin: 0; padding: 40px; }
    .container { max-width: 900px; margin: 0 auto; }
    .main-header { text-align: center; margin-bottom: 40px; }
    .main-header h1 { font-weight: 700; font-size: 2.5rem; letter-spacing: -1px; }

    /* Top 3 인기글 스타일 */
    .top3-section { margin-bottom: 50px; }
    .top3-section h2 { font-size: 1.5rem; margin-bottom: 20px; border-bottom: 2px solid #ddd; padding-bottom: 10px; }
    .top3-cards { display: flex; justify-content: space-between; gap: 20px; }
    .card { background: #fff; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); padding: 20px; width: 32%; text-align: center; }
    .card .rank { font-size: 1.8rem; font-weight: bold; color: #3e7fff; }
    .card .title { font-size: 1.1rem; font-weight: 500; margin: 10px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card .likes { font-size: 1rem; color: #e74c3c; }
    .card a { text-decoration: none; color: inherit; }

    /* 최신글 목록 스타일 */
    .latest-section { background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    .latest-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .latest-header h2 { font-size: 1.5rem; margin: 0; }
    button { background: #3e7fff; color: #fff; border: none; border-radius: 4px; font-size: 15px; padding: 8px 18px; cursor: pointer; transition: background 0.2s; }
    button:hover { background: #265ed7; }
    table { border-collapse: collapse; width: 100%; text-align: center; }
    th, td { border-bottom: 1px solid #e6e6e6; padding: 12px 10px; font-size: 15px; }
    th { background: #f8f9fa; font-weight: 500; }
    td a { color: #333; text-decoration: none; }
    td a:hover { color: #3e7fff; }
    .title-col { text-align: left; }

    /* 페이징 스타일 */
    .paging { text-align: center; margin-top: 30px; font-size: 16px; }
    .paging a, .paging span { display: inline-block; margin: 0 4px; padding: 6px 12px; border-radius: 4px; color: #555; background: #fff; border: 1px solid #ddd; text-decoration: none; transition: all 0.2s; }
    .paging a:hover { background: #e9ecef; border-color: #ccc; }
    .paging .active { background: #3e7fff; color: #fff; font-weight: 700; border-color: #3e7fff; pointer-events: none; }
  </style>
</head>
<body>
<div class="container">
  <div class="main-header">
    <h1>자유 게시판</h1>
  </div>

  <div class="top3-section">
    <h2>❤️ 인기 게시글 Top 3</h2>
    <div class="top3-cards">
      <div th:if="${top3List.isEmpty()}" style="width:100%; text-align:center; padding: 20px; color: #888;">인기글이 아직 없습니다.</div>
      <div class="card" th:each="topPost, iterStat : ${top3List}">
        <a th:href="@{|/board/${topPost.id}|}">
          <div class="rank" th:text="${iterStat.count}">1</div>
          <div class="title" th:text="${topPost.boardTitle}">인기글 제목</div>
          <div class="likes" th:text="'👍 ' + ${topPost.boardLikes}">👍 123</div>
        </a>
      </div>
    </div>
  </div>

  <div class="latest-section">
    <div class="latest-header">
      <h2>📄 최신 게시글</h2>
      <button onclick="location.href='/board/save'">글 작성</button>
    </div>
    <table>
      <tr>
        <th class="title-col" style="width:50%;">제목</th>
        <th>작성자</th>
        <th>작성일</th>
        <th>조회수</th>
        <th style="color: #e74c3c;">좋아요</th>
      </tr>
      <tr th:if="${boardList.isEmpty()}">
        <td colspan="5">작성된 글이 없습니다.</td>
      </tr>
      <tr th:each="board: ${boardList}">
        <td class="title-col">
          <a th:href="@{|/board/${board.id}|(page=${boardList.number + 1})}" th:text="${board.boardTitle}"></a>
        </td>
        <td th:text="${board.boardWriter}"></td>
        <td th:text="*{#temporals.format(board.boardCreatedTime, 'yyyy-MM-dd')}"></td>
        <td th:text="${board.boardHits}"></td>
        <td th:text="${board.boardLikes}" style="color: #e74c3c;"></td>
      </tr>
    </table>

    <div class="paging" th:if="${!boardList.isEmpty()}">
      <a th:href="@{/board/(page=1)}">처음</a>
      <a th:if="${boardList.number > 0}" th:href="@{/board/(page=${boardList.number})}">이전</a>
      <span th:each="page: ${#numbers.sequence(startPage, endPage)}">
                <span th:if="${page == boardList.number + 1}" class="active" th:text="${page}"></span>
                <a th:if="${page != boardList.number + 1}" th:href="@{/board/(page=${page})}" th:text="${page}"></a>
            </span>
      <a th:if="${boardList.number < boardList.totalPages - 1}" th:href="@{/board/(page=${boardList.number + 2})}">다음</a>
      <a th:href="@{/board/(page=${boardList.totalPages})}">마지막</a>
    </div>
  </div>
</div>
</body>
</html>
