<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <title>팁 관리자 페이지 (인라인 수정 + JSON 등록)</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 900px; margin: 2rem auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
        th, td { border: 1px solid #ccc; padding: 0.5rem; text-align: left; vertical-align: top; }
        .actions button { margin-right: 5px; }
        form.inline-edit {
          background: #f9f9f9;
          padding: 10px;
          margin-top: 10px;
          border: 1px solid #ccc;
        }
        form.inline-edit input[type="text"] {
          width: 100%;
          box-sizing: border-box;
          margin-bottom: 8px;
          padding: 6px;
        }
        form.inline-edit button {
          margin-right: 10px;
          padding: 6px 12px;
        }
        textarea {
          width: 100%;
          height: 150px;
          font-family: monospace;
        }
        #jsonImportSection {
          margin-top: 3rem;
          padding: 1rem;
          border: 1px solid #ccc;
          border-radius: 6px;
          background: #f9f9f9;
        }
        button {
          padding: 0.5rem 1rem;
          margin-right: 10px;
          margin-bottom: 10px;
          cursor: pointer;
        }
    </style>
</head>
<body>

<h1>팁 관리자 페이지</h1>

<form id="tipForm">
    <input type="text" id="question" placeholder="질문" required>
    <input type="text" id="answer" placeholder="답변" required>
    <input type="text" id="source" placeholder="출처">
    <input type="text" id="category" placeholder="카테고리" required>
    <button type="submit">추가</button>
</form>

<section id="jsonImportSection">
    <h2>새 팁 등록 (JSON 배열 입력)</h2>
    <textarea id="jsonInput" placeholder='[
  {
    "question": "한국 지하철 요금은?",
    "answer": "기본 1250원입니다.",
    "source": "서울교통공사",
    "category": "TRANSPORT"
  }
]'></textarea>
    <br />
    <button onclick="beautifyJson()">beauty</button>
    <button onclick="importTips()">등록하기</button>
</section>

<button onclick="loadTips()">팁 목록 불러오기</button>

<table>
    <thead>
    <tr>
        <th>질문</th>
        <th>답변</th>
        <th>출처</th>
        <th>카테고리</th>
        <th>관리</th>
    </tr>
    </thead>
    <tbody id="tipsTableBody"></tbody>
</table>

<script>

    document.getElementById('tipForm').addEventListener('submit', async (e) => {
  e.preventDefault();

  const tip = {
    question: document.getElementById('question').value,
    answer: document.getElementById('answer').value,
    source: document.getElementById('source').value,
    category: document.getElementById('category').value
  };

  try {
    const response = await fetch('/api/tips', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(tip)
    });

    const data = await response.json();

    if (response.ok) {
      alert("저장 성공: ID " + data.id);
    } else if (response.status === 409) {
      // 중복된 질문일 경우
      alert("중복된 질문입니다:\n" + (data.error || tip.question));
    }
    else if (response.status === 400) {
      // 잘못된 요청일 경우 (유효성 검사 실패)
      alert("입력값이 잘못되었습니다:\n" + (data.error || "필수 항목을 확인하세요."));
    }
    else {
      alert("저장 실패: " + (data.error || "알 수 없는 오류"));
    }
  } catch (err) {
    console.error(err);
    alert("서버 오류 발생");
  }
});

    let editingTipId = null;

    // XSS 방지용 간단 escape
    function escapeHtml(text) {
      if (!text) return '';
      return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    async function loadTips() {
      const res = await fetch(`/api/tips?page=0&size=20`);
      if (!res.ok) {
        alert('팁 목록 불러오기 실패');
        return;
      }
      const data = await res.json();
      const tbody = document.getElementById('tipsTableBody');
      tbody.innerHTML = '';

      data.content.forEach(tip => {
        const tr = document.createElement('tr');
        tr.id = `tip-row-${tip.id}`;
        tr.innerHTML = `
          <td>${escapeHtml(tip.question)}</td>
          <td>${escapeHtml(tip.answer)}</td>
          <td>${escapeHtml(tip.source || '')}</td>
          <td>${escapeHtml(tip.category)}</td>
          <td class="actions">
            <button onclick="showEditForm(${tip.id})" ${editingTipId === tip.id ? 'disabled' : ''}>수정</button>
            <button onclick="deleteTip(${tip.id})" ${editingTipId === tip.id ? 'disabled' : ''}>삭제</button>
          </td>
        `;
        tbody.appendChild(tr);

        // 수정 폼 행 추가 (숨김)
        const editFormTr = document.createElement('tr');
        editFormTr.id = `edit-form-row-${tip.id}`;
        editFormTr.style.display = 'none';
        editFormTr.innerHTML = `
          <td colspan="5">
            <form class="inline-edit" onsubmit="submitEdit(event, ${tip.id})">
              <input type="text" name="question" value="${escapeHtml(tip.question)}" required placeholder="질문" />
              <input type="text" name="answer" value="${escapeHtml(tip.answer)}" required placeholder="답변" />
              <input type="text" name="source" value="${escapeHtml(tip.source || '')}" placeholder="출처" />
              <input type="text" name="category" value="${escapeHtml(tip.category)}" required placeholder="카테고리" />
              <button type="submit">저장</button>
              <button type="button" onclick="cancelEdit(${tip.id})">취소</button>
            </form>
          </td>
        `;
        tbody.appendChild(editFormTr);
      });
    }

    function showEditForm(id) {
      if (editingTipId !== null) {
        alert('다른 팁 수정 중입니다. 먼저 취소해주세요.');
        return;
      }
      editingTipId = id;
      document.getElementById(`tip-row-${id}`).style.display = 'none';
      document.getElementById(`edit-form-row-${id}`).style.display = '';
    }

    function cancelEdit(id) {
      editingTipId = null;
      document.getElementById(`tip-row-${id}`).style.display = '';
      document.getElementById(`edit-form-row-${id}`).style.display = 'none';
    }

    async function submitEdit(event, id) {
      event.preventDefault();
      const form = event.target;

      const updatedTip = {
        question: form.question.value.trim(),
        answer: form.answer.value.trim(),
        source: form.source.value.trim(),
        category: form.category.value.trim()
      };

      const res = await fetch(`/api/tips/${id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(updatedTip)
      });

      if (!res.ok) {
        alert('수정 실패');
        return;
      }

      alert('수정 완료');
      editingTipId = null;
      loadTips();
    }

    async function deleteTip(id) {
      if (!confirm('정말 삭제하시겠습니까?')) return;
      const res = await fetch(`/api/tips/${id}`, { method: 'DELETE' });
      if (!res.ok) {
        alert('삭제 실패');
        return;
      }
      alert('삭제 완료');
      loadTips();
    }

    function beautifyJson() {
      const input = document.getElementById('jsonInput').value;
      try {
        const parsed = JSON.parse(input);
        const formatted = JSON.stringify(parsed, null, 2);
        document.getElementById('jsonInput').value = formatted;
      } catch (e) {
        alert("JSON 형식이 올바르지 않습니다:\n" + e.message);
      }
    }

    async function importTips() {
      const input = document.getElementById('jsonInput').value;
      let tips;
      try {
        tips = JSON.parse(input);
        if (!Array.isArray(tips)) throw new Error("JSON 배열이 아닙니다.");
      } catch (e) {
        alert("유효한 JSON 배열을 입력해주세요.\n" + e.message);
        return;
      }

      const res = await fetch('/api/tips/import', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(tips)
      });

      if (res.status === 409) {
        alert("중복된 팁이 있어 등록되지 않았습니다.");
      } else if (res.ok) {
        alert('팁 등록 완료!');
        document.getElementById('jsonInput').value = '';
        loadTips();
      } else {
        alert('등록 실패: ' + (await res.text()));
      }
    }

    window.onload = () => loadTips();
</script>

</body>
</html>
