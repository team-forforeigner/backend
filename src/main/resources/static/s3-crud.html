<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>S3 이미지 CRUD (프론트)</title>
    <style>
        /* 간단한 스타일 (심플하고 반응형) */
        :root{--bg:#f6f7fb;--card:#fff;--muted:#6b7280;--accent:#2563eb}
        *{box-sizing:border-box;font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial}
        body{margin:0;background:var(--bg);color:#111}
        .container{max-width:1100px;margin:28px auto;padding:20px}
        header{display:flex;align-items:center;gap:16px}
        h1{margin:0;font-size:20px}
        .card{background:var(--card);border-radius:12px;padding:16px;box-shadow:0 6px 18px rgba(20,20,50,0.06)}
        .row{display:flex;gap:12px}
        .col{flex:1}
        .form-row{display:flex;gap:8px;align-items:center}
        input[type=file]{display:block}
        button{background:var(--accent);color:#fff;border:0;padding:8px 12px;border-radius:8px;cursor:pointer}
        button.ghost{background:transparent;color:var(--accent);border:1px solid rgba(37,99,235,0.12)}
        .muted{color:var(--muted);font-size:13px}
        .gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;margin-top:12px}
        .tile{background:#fff;border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
        .tile img{width:100%;height:160px;object-fit:cover;background:#eee}
        .meta{padding:8px;display:flex;align-items:center;justify-content:space-between;gap:8px}
        .meta .left{display:flex;gap:8px;align-items:center}
        .filename{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:140px}
        .actions{display:flex;gap:6px}
        .notice{margin-top:12px;padding:10px;border-radius:8px;background:#fff8db;color:#735500}
        .preview{max-width:240px;max-height:160px;border-radius:8px;object-fit:cover}
        .modal{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0.45)}
        .modal .panel{width:520px;background:var(--card);padding:16px;border-radius:12px}
        @media (max-width:600px){.row{flex-direction:column}.preview{max-width:100%}}
    </style>
</head>
<body>
<div class="container">
    <header>
        <h1>S3 이미지 관리 (업로드 · 수정 · 삭제 · 조회)</h1>
        <div class="muted">간단한 프론트 예시 — 백엔드 엔드포인트와 응답 형태는 아래 설명을 확인하세요.</div>
    </header>

    <section style="margin-top:14px" class="card">
        <div class="row">
            <div class="col">
                <form id="uploadForm">
                    <div class="form-row">
                        <input id="fileInput" name="file" type="file" accept="image/*" />
                        <input id="filenameInput" name="name" type="text" placeholder="이미지 이름(선택)" />
                        <button type="submit">업로드</button>
                    </div>
                    <div style="margin-top:8px" class="muted">선택 파일을 업로드하면 서버가 S3에 저장하고 이미지 목록이 갱신됩니다.</div>
                </form>

                <div class="notice" id="notice" style="display:none"></div>
            </div>
            <div style="width:260px" class="col">
                <div class="card" style="padding:12px">
                    <div style="display:flex;gap:8px;align-items:center">
                        <img id="previewImg" class="preview" src="" alt="preview" style="display:none" />
                        <div>
                            <div class="muted">선택된 파일</div>
                            <div id="previewName" style="font-weight:600">(없음)</div>
                            <div style="margin-top:8px">
                                <button id="clearBtn" class="ghost" style="padding:6px 8px">선택 해제</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <section style="margin-top:18px">
        <div class="card">
            <div style="display:flex;align-items:center;justify-content:space-between">
                <h3 style="margin:0">이미지 목록</h3>
                <div class="muted">총 <span id="count">0</span>개</div>
            </div>

            <div id="gallery" class="gallery" style="margin-top:12px"></div>
        </div>
    </section>
</div>

<!-- 편집 모달 -->
<div id="editModal" class="modal" style="display:none">
    <div class="panel">
        <h3>이미지 수정</h3>
        <div style="margin-top:8px" class="muted">파일을 선택하면 기존 이미지가 교체됩니다.</div>
        <form id="editForm" style="margin-top:12px">
            <input id="editFileInput" type="file" accept="image/*" />
            <div style="margin-top:12px;display:flex;gap:8px;justify-content:flex-end">
                <button type="button" id="cancelEdit" class="ghost">취소</button>
                <button type="submit">저장</button>
            </div>
        </form>
    </div>
</div>

<script>
    // --- 설정 ---
    // 필요에 따라 엔드포인트를 변경하세요.
    const API = {
      LIST: '/api/s3',           // GET
      UPLOAD: '/api/s3',         // POST (multipart/form-data)
      DOWNLOAD: id => `/api/s3/${id}`, // GET (또는 url이 바로 제공될 수 있음)
      UPDATE: id => `/api/s3/${id}`,   // PUT (multipart/form-data) 또는 POST
      DELETE: id => `/api/s3/${id}`    // DELETE
    };

    // --- DOM ---
    const uploadForm = document.getElementById('uploadForm');
    const fileInput = document.getElementById('fileInput');
    const filenameInput = document.getElementById('filenameInput');
    const previewImg = document.getElementById('previewImg');
    const previewName = document.getElementById('previewName');
    const clearBtn = document.getElementById('clearBtn');
    const notice = document.getElementById('notice');

    const gallery = document.getElementById('gallery');
    const countEl = document.getElementById('count');

    const editModal = document.getElementById('editModal');
    const editForm = document.getElementById('editForm');
    const editFileInput = document.getElementById('editFileInput');
    const cancelEdit = document.getElementById('cancelEdit');

    let images = [];
    let editingId = null;

    // --- 유틸 ---
    function showNotice(msg, timeout = 3000){
      notice.textContent = msg;
      notice.style.display = 'block';
      setTimeout(()=> notice.style.display = 'none', timeout);
    }

    function readFileAsDataURL(file){
      return new Promise((res, rej)=>{
        const r = new FileReader();
        r.onload = ()=> res(r.result);
        r.onerror = rej;
        r.readAsDataURL(file);
      })
    }

    // --- 이벤트 ---
    fileInput.addEventListener('change', async (e)=>{
      const f = e.target.files?.[0];
      if(!f) return resetPreview();
      previewName.textContent = f.name;
      previewImg.src = await readFileAsDataURL(f);
      previewImg.style.display = 'block';
    });

    clearBtn.addEventListener('click', ()=>{ fileInput.value = ''; resetPreview(); });

    uploadForm.addEventListener('submit', async (e)=>{
      e.preventDefault();
      const f = fileInput.files?.[0];
      if(!f){ showNotice('파일을 선택하세요.'); return; }

      const form = new FormData();
      form.append('file', f);
      if(filenameInput.value) form.append('name', filenameInput.value);

      try{
        const res = await fetch(API.UPLOAD, { method:'POST', body: form });
        if(!res.ok) throw new Error('업로드 실패');
        showNotice('업로드 성공');
        fileInput.value = '';
        filenameInput.value = '';
        resetPreview();
        await loadImages();
      }catch(err){
        console.error(err);
        showNotice('업로드 중 오류가 발생했습니다. 콘솔을 확인하세요.');
      }
    });

    // 편집/수정
    cancelEdit.addEventListener('click', ()=>{ closeEdit(); });

    editForm.addEventListener('submit', async (e)=>{
      e.preventDefault();
      const f = editFileInput.files?.[0];
      if(!f){ showNotice('교체할 파일을 선택하세요.'); return; }
      try{
        const form = new FormData();
        form.append('file', f);
        // 만약 이름 변경 기능이 필요하면 form.append('name', '새이름')
        const res = await fetch(API.UPDATE(editingId), { method: 'PUT', body: form });
        if(!res.ok) throw new Error('수정 실패');
        showNotice('수정 성공');
        closeEdit();
        await loadImages();
      }catch(err){
        console.error(err);
        showNotice('수정 중 오류가 발생했습니다.');
      }
    });

    // --- CRUD 함수 ---
    async function loadImages(){
      try{
        const res = await fetch(API.LIST);
        if(!res.ok) throw new Error('목록 조회 실패');
        images = await res.json();
        // 서버가 배열을 반환한다고 가정: [{id, filename, url, createdAt}, ...]
        renderGallery();
      }catch(err){
        console.error(err);
        showNotice('이미지 목록을 불러오는 중 오류가 발생했습니다.');
      }
    }

    function renderGallery(){
      gallery.innerHTML = '';
      countEl.textContent = images.length;
      images.forEach(item => {
        const el = document.createElement('div');
        el.className = 'tile';

        const img = document.createElement('img');
        img.src = item.url || API.DOWNLOAD(item.id);
        img.alt = item.filename || '';

        const meta = document.createElement('div');
        meta.className = 'meta';

        const left = document.createElement('div');
        left.className = 'left';
        const name = document.createElement('div');
        name.className = 'filename';
        name.textContent = item.filename || ('이미지 ' + item.id);
        left.appendChild(name);

        const actions = document.createElement('div');
        actions.className = 'actions';

        const btnView = document.createElement('button');
        btnView.className = 'ghost';
        btnView.textContent = '열기';
        btnView.addEventListener('click', ()=> window.open(item.url || API.DOWNLOAD(item.id), '_blank'));

        const btnEdit = document.createElement('button');
        btnEdit.textContent = '수정';
        btnEdit.addEventListener('click', ()=> openEdit(item.id));

        const btnDelete = document.createElement('button');
        btnDelete.className = 'ghost';
        btnDelete.textContent = '삭제';
        btnDelete.addEventListener('click', ()=> doDelete(item.id, item.filename));

        actions.append(btnView, btnEdit, btnDelete);

        meta.append(left, actions);

        el.appendChild(img);
        el.appendChild(meta);
        gallery.appendChild(el);
      });
    }

    async function doDelete(id, name){
      if(!confirm(`${name || id} 을(를) 삭제하시겠습니까?`)) return;
      try{
        const res = await fetch(API.DELETE(id), { method:'DELETE' });
        if(!res.ok) throw new Error('삭제 실패');
        showNotice('삭제 성공');
        await loadImages();
      }catch(err){
        console.error(err);
        showNotice('삭제 중 오류가 발생했습니다.');
      }
    }

    function openEdit(id){
      editingId = id;
      editFileInput.value = '';
      editModal.style.display = 'flex';
    }
    function closeEdit(){ editingId = null; editModal.style.display = 'none'; }

    function resetPreview(){ previewImg.style.display = 'none'; previewImg.src=''; previewName.textContent='(없음)'; }

    // 시작
    loadImages();
</script>
</body>
</html>
